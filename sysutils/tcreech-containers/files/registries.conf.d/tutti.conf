# LAN container registry — registry drop-in for the podman *server* host.
#
# "insecure" means plain HTTP, not a bad certificate: this registry is LAN-only and
# has no cert. Integrity is unaffected either way (images are content-addressed);
# what HTTP forgoes is authenticity of the tag -> digest mapping, the same trade
# already made with DHCP and router DNS.
#
# The prefix entry silences TLS for this name; it does NOT make bare names resolve
# here. To pull `freebsd-user` without a prefix, uncomment the search line — but a
# name that exists both upstream and here then resolves UPSTREAM first, since podman
# only falls through to the next entry on a 404 from docker.io, so a typo'd upstream
# name silently pulls something unexpected.
#
# The resident API server reads this at start-up and caches it, so a new drop-in does
# not take effect on its own. Measured: right after installing this file, skopeo (which
# reaches the registry directly) honoured `insecure` immediately, while podman over the
# socket kept trying HTTPS because `podman system service --time=0` predated the file.
# Apply it with:
#   sudo service podman_service restart   # API only; running containers are untouched
# NOT `service podman restart` -- that is a different script, which stops and starts the
# restart=always containers, i.e. a brief outage for every resident service on the
# host, the registry included.
# Naming trap: registries.conf.d is the drop-in dir for registries.conf (endpoints,
# mirrors, insecure). registries.d is unrelated -- YAML saying where image *signatures*
# live (lookaside/sigstore) -- and signature policy is the separate policy.json, which
# defaults to accepting anything unsigned. certs.d/ is per-registry TLS material, i.e.
# what this file would grow into if the registry ever got a private-CA cert.

unqualified-search-registries = ["registry.tutti.tcreech.com", "docker.io"]

[[registry]]
prefix = "registry.tutti.tcreech.com"
location = "registry.tutti.tcreech.com"
insecure = true
